extarea id="note" data-note="${q.id}" rows="3" placeholder="Tulis apa yang ingin Anda ingat…">${esc(saved.notes[q.id]||'')}</textarea></div><div class="actions" style="margin-top:15px"><button class="btn sm subtle" data-action="mark" data-id="${q.id}">${saved.bookmarks.includes(q.id)?'★ Ditandai':'☆ Tandai'}</button>${q.moduleLink?`<a class="btn sm ghost" target="_blank" rel="noopener" href="${esc(q.moduleLink)}${q.modulePage?'#page='+esc(q.modulePage):''}">Buka modul ↗</a>`:''}${q.origin==='historis'?`<a class="btn sm ghost" target="_blank" rel="noopener" href="materi/tryout-historis.pdf#page=${esc(q.sourcePage||1)}">Lihat naskah try out ↗</a>`:''}<button class="btn sm" data-action="singlePractice" data-id="${q.id}">Latih soal ini →</button></div></div></div>`}
function render(){document.documentElement.dataset.theme=saved.theme;document.body.classList.toggle('quiz-active',state.view==='quiz');closeQuizNavigator();let ttl={home:'Beranda',setup:'Atur Latihan',quiz:'Sesi Latihan',bank:'Bank Soal',kamus:'Kamus Materi',stats:'Statistik',resources:'Modul & PDF',help:'Panduan',result:'Hasil Latihan'};let mobileTitle=document.getElementById('mobileTopTitle');if(mobileTitle)mobileTitle.textContent=ttl[state.view]||'PBJ Akademi';document.querySelectorAll('#mobileBottomNav button[data-view]').forEach(b=>{let active=b.dataset.view===state.view||(state.view==='quiz'&&b.dataset.view==='setup');b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#breadcrumb').textContent={home:'Beranda / Persiapan Sertifikasi',setup:'Latihan / Pengaturan',quiz:'Latihan / Sesi aktif',bank:'Bank Soal / Semua',kamus:'Kamus / Pembahasan',stats:'Statistik / Progres',resources:'Sumber / PDF Offline',help:'Panduan / QA',result:'Latihan / Hasil'}[state.view]||'PBJ Akademi';document.querySelectorAll('#sidenav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view||(state.view==='quiz'&&b.dataset.view==='setup')));let html={home,setup,quiz,bank,kamus,stats,resources,help,result:resultView}[state.view]?.()||home();$('#content').innerHTML=html;$('#modalroot').innerHTML=state.modal?modal(row(state.modal)):'';document.title=(state.view==='quiz'?'Sesi Latihan':'PBJ Akademi')+' — PBJ Level 1';if(state.view==='quiz')timerTick()}
function toast(message){const root=$('#toastroot');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>{if(root)root.innerHTML=''},3200)}
function updateSeen(q,choice){if(!choice)return;let rec=saved.attempts[q.id]||{attempts:0,right:0,wrong:0,scored:0};rec.attempts++;if(q.scorable){rec.scored++;if(choice===q.key)rec.right++;else rec.wrong++}rec.last=Date.now();saved.attempts[q.id]=rec}
function timerTick(){const s=saved.session;if(!s||s.finished||state.view!=='quiz'||!s.limit)return;let elapsed=Math.floor((Date.now()-s.startedAt)/1000),remaining=Math.max(0,s.limit-elapsed);const el=$('#timer');if(el)el.textContent=msTime(remaining);if(!remaining){finish(true)}}
function finish(auto=false){let s=saved.session;if(!s||s.finished)return;let items=s.ids.map(id=>({id,selected:s.answers[id]||null}));let sc=0,right=0,answered=0;for(let it of items){let q=row(it.id);if(it.selected){answered++;if(q?.scorable){sc++;if(it.selected===q.key)right++}if(!s.reviewed[it.id]){updateSeen(q,it.selected);s.reviewed[it.id]=true}}}let h={finishedAt:Date.now(),mode:s.mode,total:items.length,answered,scored:sc,correct:right,items};saved.history.push({...h,items:undefined});if(saved.history.length>150)saved.history=saved.history.slice(-150);saved.session=null;state.lastResult=h;persist();go('result');if(auto)toast('Waktu simulasi berakhir. Hasil sudah disimpan.')}
function downloadFile(name,text,type){const b=new Blob([text],{type});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function openModal(id){state.modal=id;render();$('#modalroot .modal')?.focus()}
function clickAction(btn){let a=btn.dataset.action;switch(a){case 'go':go(btn.dataset.view);break;case 'sidebar':document.body.classList.contains('menu-open')?closeSidebarMenu():openSidebarMenu();break;case 'closeSidebar':closeSidebarMenu();break;case 'openQuizNav':openQuizNavigator();break;case 'closeQuizNav':closeQuizNavigator();break;case 'jumpNumber':{let s=saved.session;if(!s)return;let val=Number(document.getElementById('mobileJumpNumber')?.value);if(!Number.isInteger(val)||val<1||val>s.ids.length){toast('Nomor harus antara 1 dan '+s.ids.length);return}closeQuizNavigator();s.idx=val-1;persist();render();scrollTo({top:0,behavior:'instant'});break}case 'theme':saved.theme=saved.theme==='dark'?'light':'dark';persist();render();break;case 'setupVal':state.setup[btn.dataset.field]=btn.dataset.value;render();break;case 'all294':Object.assign(state.setup,{pool:'all',type:'all',module:'all',chapter:'all',count:'all'});render();toast('Semua 294 soal siap dipilih.');break;case 'modulePractice':state.setup.module=btn.dataset.module;state.setup.chapter='all';go('setup');break;case 'startSession':{let s=state.setup;let pool=QS.filter(x=>(s.pool==='all'||x.scorable)&&(s.type==='all'||x.origin===s.type)&&(s.module==='all'||x.module===s.module)&&(s.chapter==='all'||x.chapter===s.chapter));shuffleItems(pool);let n=selectedQuestionCount(s,pool.length);if(!n)return toast('Jumlah soal tidak valid atau filter tidak memiliki soal.');if(s.count==='custom'&&(!Number.isFinite(Number(s.customCount))||Number(s.customCount)<1||Number(s.customCount)>294))return toast('Jumlah khusus harus 1–294 soal.');if(s.minutes==='custom'&&(!Number.isFinite(Number(s.customMinutes))||Number(s.customMinutes)<1||Number(s.customMinutes)>720))return toast('Durasi khusus harus 1–720 menit.');if(saved.session&&!confirm('Ganti sesi yang saat ini tersimpan?'))return;startSession(pool.slice(0,n).map(x=>x.id),s.mode);break}case 'resume':if(saved.session)go('quiz');else toast('Belum ada sesi tersimpan.');break;case 'quickStart':{let a=QS.filter(q=>q.scorable).sort(()=>Math.random()-.5).slice(0,10);if(saved.session&&!confirm('Ganti sesi yang saat ini tersimpan?'))return;startSession(a.map(x=>x.id),'study');break}case 'answer':{let s=saved.session;if(!s)return;let id=s.ids[s.idx];if(s.mode==='study'&&s.reviewed[id])return;s.answers[id]=btn.dataset.option;persist();render();break}case 'reviewAnswer':{let s=saved.session;let q=row(s.ids[s.idx]);let choice=s.answers[q.id];if(!choice)return; if(!s.reviewed[q.id])updateSeen(q,choice);s.reviewed[q.id]=true;persist();render();break}case 'prevQ':saved.session.idx=Math.max(0,saved.session.idx-1);persist();render();break;case 'nextQ':{let s=saved.session;if(s.idx>=s.ids.length-1)finish();else{s.idx++;persist();render()}break}case 'jumpQ':saved.session.idx=+btn.dataset.index;persist();render();break;case 'finishSession':if(confirm('Selesaikan sesi dan tampilkan hasil sekarang?'))finish();break;case 'mark':{let id=btn.dataset.id;let a=saved.bookmarks;let i=a.indexOf(id);if(i<0)a.push(id);else a.splice(i,1);persist();render();break}case 'difficult':{let id=btn.dataset.id;let a=saved.difficult;let i=a.indexOf(id);if(i<0)a.push(id);else a.splice(i,1);persist();render();break}case 'questionDetail':openModal(btn.dataset.id);break;case 'closeModal':state.modal=null;render();break;case 'singlePractice':{let id=btn.dataset.id;if(saved.session&&!confirm('Ganti sesi yang saat ini tersimpan?'))return;startSession([id],'study');break}case 'bankPage':state.bankPage=Math.max(0,+btn.dataset.page);render();scrollTo({top:0,behavior:'instant'});break;case 'practiceFilter':{let arr=filteredBank();if(!arr.length)return;let ids=arr.slice(0,Math.min(arr.length,50)).map(x=>x.id);if(saved.session&&!confirm('Ganti sesi yang saat ini tersimpan?'))return;startSession(ids,'study');break}case 'glossPractice':{let map={'M1-DASAR':MODS[0].code,'M2-SCM':MODS[1].code,'M3-RENC':MODS[2].code,'M4-PILIH':MODS[3].code,'M5-KON':MODS[4].code,'M6-SWAK':MODS[5].code};state.setup.module=map[btn.dataset.code]||'all';state.setup.chapter='all';go('setup');break}case 'reviewWrong':{let ids=Object.entries(saved.attempts).filter(([id,v])=>v.wrong>0).map(x=>x[0]);if(saved.session&&!confirm('Ganti sesi yang saat ini tersimpan?'))return;startSession(ids,'study');break}case 'practiceBookmarks':case 'practiceDifficult':{let ids=a==='practiceBookmarks'?saved.bookmarks:saved.difficult;if(saved.session&&!confirm('Ganti sesi yang saat ini tersimpan?'))return;startSession(ids.filter(id=>row(id)),'study');break}case 'export':downloadFile('progres-pbj-level1.json',JSON.stringify({kind:'pbj-akademi-backup',version:1,exportedAt:new Date().toISOString(),saved},null,2),'application/json');toast('File cadangan progres dibuat.');break;case 'import':$('#importFile').click();break;case 'reset':if(confirm('Hapus SELURUH progres, catatan, bookmark, dan riwayat di browser ini? Tindakan ini tidak dapat dibatalkan.')){saved={attempts:{},bookmarks:[],difficult:[],notes:{},history:[],session:null,theme:saved.theme};persist();render();}break;default:break}}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn)return;if(btn.classList.contains('modalwrap')&&e.target!==btn)return;if(btn.tagName==='A')return;e.preventDefault();let action=btn.dataset.action;clickAction(btn);if(['jumpQ','prevQ','nextQ'].includes(action)&&state.view==='quiz')window.scrollTo({top:0,behavior:'instant'});if(action==='reviewAnswer'&&window.matchMedia('(max-width:850px)').matches){setTimeout(()=>document.querySelector('.feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'}),40)}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.setupInput){state.setup[el.dataset.setupInput]=el.value;refreshSetupPreview();return}if(el.dataset.setup){let f=el.dataset.setup;state.setup[f]=['count','minutes'].includes(f)&&!['all','custom'].includes(el.value)?Number(el.value):el.value;if(f==='module'||f==='type'||f==='pool')state.setup.chapter='all';render()}else if(el.dataset.select){state[el.dataset.select]=el.value;state.bankPage=0;render()}});
let inputTimer;document.addEventListener('input',e=>{let el=e.target;if(el.dataset.setupInput){state.setup[el.dataset.setupInput]=el.value;refreshSetupPreview();return}if(el.dataset.search){let key=el.dataset.search;state[key]=el.value;state.bankPage=0;let pos=el.selectionStart;clearTimeout(inputTimer);inputTimer=setTimeout(()=>{render();let x=document.querySelector(`[data-search="${key}"]`);if(x){x.focus();x.setSelectionRange(pos,pos)}},160)}else if(el.dataset.note){saved.notes[el.dataset.note]=el.value;persist()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.classList.contains('quiz-sheet-open')){closeQuizNavigator();return}if(document.body.classList.contains('menu-open')){closeSidebarMenu();return}if(state.modal){state.modal=null;render();return}}if((e.key==='Enter'||e.key===' ')&&document.activeElement?.getAttribute('role')==='button'){e.preventDefault();document.activeElement.click();return}if(e.key==='Enter'&&document.activeElement?.id==='mobileJumpNumber'){e.preventDefault();clickAction({dataset:{action:'jumpNumber'}});return}if(!saved.session||state.view!=='quiz'||state.modal||document.body.classList.contains('quiz-sheet-open')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;let s=saved.session,q=row(s.ids[s.idx]);if('1234'.includes(e.key)&&e.key.length===1){e.preventDefault();let option='ABCD'[+e.key-1];if(!(s.mode==='study'&&s.reviewed[q.id])){s.answers[q.id]=option;persist();render()}}else if(e.key==='Enter'){e.preventDefault();if(s.mode==='study'&&!s.reviewed[q.id]){if(s.answers[q.id])clickAction({dataset:{action:'reviewAnswer'}})}else clickAction({dataset:{action:'nextQ'}})}else if(e.key==='ArrowLeft'){e.preventDefault();clickAction({dataset:{action:'prevQ'}})}else if(e.key==='ArrowRight'){e.preventDefault();clickAction({dataset:{action:'nextQ'}})}});
const file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.id='importFile';file.style.display='none';document.body.appendChild(file);file.addEventListener('change',async()=>{try{let j=JSON.parse(await file.files[0].text());if(j.kind!=='pbj-akademi-backup'||!j.saved?.attempts||!confirm('Ganti progres browser dengan cadangan yang dipilih?'))return;saved=Object.assign({attempts:{},bookmarks:[],difficult:[],notes:{},history:[],session:null,theme:'light'},j.saved);persist();render();toast('Progres berhasil diimpor.')}catch(e){toast('File progres tidak valid atau tidak dapat dibaca.')}file.value=''});
window.addEventListener('resize',()=>{if(window.innerWidth>850){closeSidebarMenu();closeQuizNavigator()}});
setInterval(timerTick,800);
if(saved.session&&saved.session.limit&&Date.now()-saved.session.startedAt>saved.session.limit*1000){finish(true)}
try{let hash=location.hash.replace('#/','');if(['home','setup','quiz','bank','kamus','stats','resources','help'].includes(hash))state.view=hash;if(state.view==='quiz'&&!saved.session)state.view='home'}catch(e){}
render();
})();
</script>

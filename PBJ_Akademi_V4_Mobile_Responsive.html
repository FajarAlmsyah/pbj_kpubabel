/* PBJ Akademi v2: explicit full-bank practice, custom questions and timer */
.setup-allbar{border:1px solid var(--line);background:var(--teal-soft);padding:13px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}.setup-allbar b{font-size:13px}.setup-allbar .tiny{margin-top:3px}.setup-allbar .btn{white-space:normal;text-align:center}
.field input[data-setup-input]{margin-top:6px;border-color:var(--teal)}.field small{line-height:1.5}.quiz-panel .qgrid{max-height:380px;overflow-y:auto;scrollbar-width:thin;padding:3px}.setup-right .warning{margin-top:12px}
@media(max-width:720px){.setup-allbar .btn{width:100%}}

/* PBJ Akademi V4: mobile-first UI / UX enhancement; data and grading unchanged */
:root{--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:88px}
body{overflow-x:hidden}
button,select,input,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.question-title,.item p,.gloss p,.feedback p{overflow-wrap:anywhere}
.mobile-top-title,.mobile-bottom-nav,.sidebar-backdrop,.mobile-quiz-dock,.quiz-sheet-overlay,.quiz-sheet,.setup-mobile-summary{display:none}

.mobile-menu svg{width:20px;height:20px}
.setup-mobile-summary .micro{font-size:11px;color:var(--muted);font-weight:650}
.radio-card:focus-visible,.module:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.layout{display:block;min-height:100dvh}

.topbar{height:62px;padding:0 18px;gap:10px;top:0;z-index:25}

.breadcrumb{display:none}

.quiz-panel{display:none}

.stats{grid-template-columns:repeat(2,minmax(0,1fr))}

.quizbar .controls{margin-left:auto;gap:6px}

 body.quiz-sheet-open .quiz-sheet,body.quiz-sheet-open .quiz-sheet-overlay{display:flex}

"Prinsip efisien, efektif, transparan, terbuka, bersaing, adil, dan akuntabel digunakan untuk menilai mutu keputusan. Misalnya, syarat yang sengaja menghambat peserta dapat bersinggungan dengan keterbukaan, persaingan dan keadilan.","page":"2","sourcePage":"4"},{"id":"K005","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB II — Ketentuan Umum Pengadaan Barang/Jasa","title":"Peran pelaku usaha kecil, PDN/TKDN dan pengadaan berkelanjutan","description":"Kebijakan keberpihakan usaha kecil, koperasi dan produk dalam negeri perlu dibaca bersama mutu, persaingan sehat, serta kewajiban pengadaan berkelanjutan. Soal TKDN menguji tujuan penggunaan produk dalam negeri, bukan otomatis bentuk kontrak.","page":"2","sourcePage":"4"},{"id":"K006","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB II — Ketentuan Umum Pengadaan Barang/Jasa","title":"Pengadaan elektronik: sistem pengadaan, katalog dan informasi","description":"SPSE/LPSE dan katalog adalah sarana, bukan pengganti pengambilan keputusan yang benar. Aturan katalog berubah pada 2026; jangan menganggap uraian prosedur pada modul 2023 otomatis tetap sama.","page":"3","sourcePage":"4"},{"id":"K007","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB III — Kelembagaan, Sumber Daya Manusia dan Pelaku PBJP","title":"Kelembagaan PBJP: UKPBJ, peran institusi","description":"UKPBJ memfasilitasi fungsi pengadaan dan peningkatan kematangan kelembagaan. Bedakan lembaga/unit pengelola dari individu pejabat yang menandatangani atau mengevaluasi.","page":"3","sourcePage":"37"},{"id":"K008","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB III — Kelembagaan, Sumber Daya Manusia dan Pelaku PBJP","title":"SDM pengadaan dan kompetensi","description":"Peningkatan kompetensi, jabatan fungsional, dan pengembangan kapasitas mendukung kualitas hasil pengadaan. Soal dapat membedakan peran SDM, organisasi dan pelaku formal.","page":"3","sourcePage":"37"},{"id":"K009","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB III — Kelembagaan, Sumber Daya Manusia dan Pelaku PBJP","title":"Pelaku PBJP: PA, KPA, PPK, Pejabat Pengadaan, Pokja Pemilihan, Agen Pengadaan, penyelenggara Swakelola dan Penyedia","description":"PA/KPA terkait otorisasi anggaran; PPK berkaitan dengan persiapan dan pengelolaan komitmen; Pejabat Pengadaan/Pokja dengan proses pemilihan sesuai ketentuan. Hindari menukar kewenangan saat membaca kasus.","page":"3","sourcePage":"37"},{"id":"K010","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB IV — Kedudukan Hukum dalam PBJP","title":"Aspek hukum PBJP dan konsekuensi perjanjian","description":"Keputusan PBJP memiliki sisi hukum administrasi, perikatan/kontrak dan dapat berkaitan dengan bidang hukum lain. Temuan prosedural tidak boleh langsung disimpulkan sebagai tindak pidana tanpa unsur dan bukti.","page":"4","sourcePage":"54"},{"id":"K011","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB IV — Kedudukan Hukum dalam PBJP","title":"Pengawasan, pengaduan, sanksi serta pelayanan hukum","description":"APIP, pengaduan, audit dan sanksi berfungsi memastikan akuntabilitas. Perhatikan pihak yang dikenai sanksi, perbuatan yang terjadi dan aturan yang dijadikan dasar; konsekuensinya tidak seragam.","page":"4","sourcePage":"54"},{"id":"K012","module":"Pengantar Pengadaan Barang/Jasa Pemerintah","moduleCode":"M1-DASAR","chapter":"BAB V — Penutup","title":"Simpulan; implikasi; tindak lanjut pembelajaran; kunci jawaban, pustaka, glosarium","description":"Gunakan simpulan untuk menegaskan konsep utama, lalu kerjakan latihan dan evaluasi tanpa melihat kunci terlebih dahulu. Kunci jawaban modul membantu memeriksa alasan; pustaka dan glosarium menjadi tempat memastikan istilah.","page":"4","sourcePage":"71"},{"id":"K013","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB I — Pendahuluan","title":"Latar belakang; tujuan dan ruang lingkup modul","description":"Modul memperkenalkan mengapa rantai pasok relevan bagi instansi pemerintah: barang/jasa perlu tersedia dari sumbernya sampai pengguna akhir. Tujuan pembelajaran menjadi tolok ukur kemampuan membedakan aliran dan tingkat manajerial.","page":"5","sourcePage":"1"},{"id":"K014","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB II — Konsep Dasar Manajemen Rantai Pasok","title":"Segmen: hulu (upstream), internal, hilir (downstream)","description":"Hulu mencakup pencarian serta pengelolaan pemasok sebelum barang diterima organisasi. Kata kerja “mencari pemasok” mengarahkan pada upstream, bukan gudang atau distribusi.","page":"5","sourcePage":"3"},{"id":"K015","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB II — Konsep Dasar Manajemen Rantai Pasok","title":"Pengertian MRP/SCM dan aliran barang/jasa, uang, informasi","description":"Manajemen rantai pasok mengoordinasikan aliran barang/jasa, informasi dan keuangan antaraktor. Efektivitas pengadaan belum cukup apabila barang tidak sampai pada waktu atau kondisi yang dibutuhkan.","page":"5","sourcePage":"3"},{"id":"K016","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB II — Konsep Dasar Manajemen Rantai Pasok","title":"Aspek manajemen rantai pasok","description":"Kinerja pasokan dapat dilihat dari mutu/keandalan, daya tanggap, kelincahan, biaya dan aset menurut kerangka yang dipelajari. Tiap aspek menjawab masalah yang berbeda: cepat, tepat, murah atau efisien memanfaatkan persediaan.","page":"5","sourcePage":"3"},{"id":"K017","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB II — Konsep Dasar Manajemen Rantai Pasok","title":"Siklus rantai pasok: perencanaan, pengadaan, operasi, distribusi","description":"Pahami hubungan perencanaan kebutuhan, pencarian sumber, pengelolaan operasi, pengiriman serta proses balik/umpan balik. Keterlambatan satu mata rantai akan memengaruhi hasil pelayanan publik.","page":"5","sourcePage":"3"},{"id":"K018","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB III — Keterkaitan PBJP dengan Manajemen Rantai Pasok","title":"Kegiatan PBJP dan batas rantai pasok sektor pemerintah","description":"Pengadaan adalah salah satu fungsi dalam sistem rantai pasok. Kontrak berhasil belum tentu menjamin distribusi berhasil; tanggung jawab dan alur dari hulu sampai hilir perlu dipetakan.","page":"6","sourcePage":"12"},{"id":"K019","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB III — Keterkaitan PBJP dengan Manajemen Rantai Pasok","title":"Hubungan manajemen pasokan dengan nilai/manfaat pengadaan","description":"Nilai pengadaan tidak berhenti pada harga terendah. Ketersediaan, mutu, ketepatan waktu, pemeliharaan dan penerimaan layanan memengaruhi nilai manfaat bagi pengguna akhir.","page":"6","sourcePage":"12"},{"id":"K020","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB IV — Penerapan MRP dalam PBJP","title":"Level manajerial: strategis, taktis, operasional","description":"Keputusan strategis menyangkut kebijakan dan rancangan jaringan pasokan; taktis menerjemahkannya menjadi pengaturan sumber daya; operasional menjalankan aktivitas harian. Penyusunan regulasi/arah kebijakan tergolong ranah strategis.","page":"6","sourcePage":"21"},{"id":"K021","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB IV — Penerapan MRP dalam PBJP","title":"Penerapan rantai pasok dalam aktivitas pengadaan","description":"Bandingkan rantai pasok pendek, panjang, dan kompleks berdasarkan pelaku dan titik akhir barang. Contoh pengadaan meja kantor: bahan baku → pabrik → distributor → pemakai akhir.","page":"6","sourcePage":"21"},{"id":"K022","module":"Pengantar Manajemen Rantai Pasok","moduleCode":"M2-SCM","chapter":"BAB V — Penutup","title":"Kesimpulan; implikasi; tindak lanjut; kunci jawaban, pustaka, glosarium","description":"Baca kesimpulan bersama indikator pembelajaran, lalu uji satu kasus sederhana. Glosarium berguna saat menemukan istilah teknis yang mirip tetapi berbeda makna.","page":"7","sourcePage":"33"},{"id":"K023","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB I — Pendahuluan","title":"Kompetensi dasar dan indikator keberhasilan","description":"Target belajar membantu mengarahkan materi, bukan bagian prosedur kontrak atau pemilihan tersendiri. Baca indikator modul sebelum menjawab soal evaluasi.","page":"7","sourcePage":"1"},{"id":"K024","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB II — Identifikasi/Reviu Kebutuhan dan Penetapan Jenis Barang/Jasa","title":"Definisi dan ruang lingkup perencanaan","description":"Perencanaan menghubungkan sasaran kegiatan instansi dengan kebutuhan, jenis paket, dokumen teknis, strategi dan RUP. Ini berbeda dari persiapan pemilihan yang menangani rancangan kontrak dan HPS untuk paket tertentu.","page":"7","sourcePage":"4"},{"id":"K025","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB II — Identifikasi/Reviu Kebutuhan dan Penetapan Jenis Barang/Jasa","title":"Identifikasi kebutuhan berdasarkan fungsi dan kondisi eksisting","description":"Mulailah dari kebutuhan layanan dan kondisi aset/layanan yang sudah ada; uraikan gap, kuantitas, mutu serta waktu. Spesifikasi tidak seharusnya menjadi titik awal sebelum kebutuhan ditentukan.","page":"8","sourcePage":"4"},{"id":"K026","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB II — Identifikasi/Reviu Kebutuhan dan Penetapan Jenis Barang/Jasa","title":"Jenis pengadaan: Barang, Konstruksi, Jasa Konsultansi, Jasa Lainnya","description":"Empat kategori adalah Barang, Pekerjaan Konstruksi, Jasa Konsultansi dan Jasa Lainnya. Kelompokkan pekerjaan berdasarkan sifat keluarannya, karena ambang Pengadaan Langsung, metode serta bentuk kontrak berbeda.","page":"8","sourcePage":"4"},{"id":"K027","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB III — Penyusunan Spesifikasi Teknis dan KAK","title":"Spesifikasi teknis: mutu, fungsi, kinerja, jumlah","description":"Spesifikasi teknis menjelaskan karakteristik atau fungsi hasil yang dapat diuji, sedangkan KAK menata keluaran, lingkup, metode, sumber daya dan waktu. Hindari desain persyaratan yang tidak proporsional atau menunjuk merek tanpa dasar.","page":"8","sourcePage":"13"},{"id":"K028","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB III — Penyusunan Spesifikasi Teknis dan KAK","title":"Kerangka Acuan Kerja: keluaran, tujuan, metode dan jadwal","description":"KAK menyebut latar belakang, tujuan, keluaran, ruang lingkup, waktu, sumber daya dan ukuran keberhasilan. KAK yang jelas membantu penyedia mengajukan penawaran dan memudahkan pemeriksaan hasil.","page":"8","sourcePage":"13"},{"id":"K029","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB IV — Penyusunan Perkiraan Harga untuk Setiap Tahapan","title":"Penyusunan RAB untuk kebutuhan anggaran","description":"RAB menyusun kebutuhan biaya dari volume, satuan dan komponen sumber daya. Angka harus masuk akal dan terkait keluaran, bukan sekadar menyesuaikan sisa anggaran.","page":"9","sourcePage":"22"},{"id":"K030","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB IV — Penyusunan Perkiraan Harga untuk Setiap Tahapan","title":"Penyusunan HPS untuk proses pemilihan menurut ketentuannya","description":"HPS ditetapkan PPK menggunakan data yang dapat dipertanggungjawabkan menurut ketentuan; nilai totalnya tidak rahasia namun rincian tertentu dijaga. Lihat halaman catatan aturan baru untuk pengecualian HPS.","page":"9","sourcePage":"22"},{"id":"K031","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB V — Strategi Pengadaan, Pemaketan dan Cara Pengadaan","title":"Perumusan strategi pengadaan","description":"Strategi pengadaan mempertimbangkan pasar, waktu, jenis kebutuhan, pemaketan dan kapasitas pelaku. Memilih metode hanya karena kebiasaan instansi dapat menghasilkan cara pengadaan yang salah.","page":"9","sourcePage":"34"},{"id":"K032","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB V — Strategi Pengadaan, Pemaketan dan Cara Pengadaan","title":"Pemaketan: menggabungkan/memisahkan secara proporsional","description":"Pemaketan membentuk kebutuhan menjadi satu atau beberapa paket yang efisien dan bersaing; pemecahan sengaja untuk menghindari tender adalah jebakan klasik. Konsolidasi dapat menggabungkan kebutuhan serupa untuk efisiensi.","page":"9","sourcePage":"34"},{"id":"K033","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB V — Strategi Pengadaan, Pemaketan dan Cara Pengadaan","title":"Konsolidasi pengadaan","description":"Konsolidasi menyatukan kebutuhan/paket yang sesuai agar lebih efisien dengan tetap menilai kapasitas pasar. Jangan mengartikan konsolidasi sebagai penggabungan semua hal tanpa mempertimbangkan karakteristik barang/jasa.","page":"10","sourcePage":"34"},{"id":"K034","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB V — Strategi Pengadaan, Pemaketan dan Cara Pengadaan","title":"Penetapan cara pengadaan: Penyedia dan/atau Swakelola","description":"Cara memperoleh B/J adalah melalui Penyedia dan/atau Swakelola. Ini berbeda dari “metode pemilihan” seperti tender, seleksi atau Pengadaan Langsung yang hanya berlaku pada jalur penyedia.","page":"10","sourcePage":"34"},{"id":"K035","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB V — Strategi Pengadaan, Pemaketan dan Cara Pengadaan","title":"Rencana Umum Pengadaan (RUP)","description":"RUP menginformasikan rencana pengadaan kepada publik melalui mekanisme pengumuman yang ditetapkan. RUP bukan hasil evaluasi peserta dan bukan kontrak.","page":"10","sourcePage":"34"},{"id":"K036","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB VI — Perumusan Organisasi Pengadaan Barang/Jasa Pemerintah","title":"Organisasi/pelaku pengadaan dan hubungan tanggung jawab","description":"Atur siapa merencanakan, menyiapkan, memilih, dan mengelola kontrak. Peran PA/KPA, PPK, Pokja dan UKPBJ tidak boleh dipertukarkan hanya untuk mempersingkat alur.","page":"10","sourcePage":"49"},{"id":"K037","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB VI — Perumusan Organisasi Pengadaan Barang/Jasa Pemerintah","title":"UKPBJ dan keterkaitannya dengan perencanaan","description":"UKPBJ mendukung penyelenggaraan fungsi pengadaan dan dapat menjadi sumber kompetensi/layanan konsultasi pengadaan. Penyusunan kebutuhan dan tanggung jawab anggaran tetap mengikuti pejabat yang diberi kewenangan.","page":"11","sourcePage":"49"},{"id":"K038","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB VII — Risiko dalam Perencanaan PBJP","title":"Risiko kebutuhan tidak tepat, spesifikasi bias, estimasi anggaran salah, pemaketan tidak sah","description":"Risiko utama berupa salah memahami kebutuhan, spek yang membatasi persaingan, estimasi harga tidak kuat, atau pemaketan yang memecah secara tidak sah. Mitigasinya adalah reviu kebutuhan, konsultasi teknis, survei pasar dan pemeriksaan paket.","page":"11","sourcePage":"52"},{"id":"K039","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB VIII — Identifikasi dan Pengumpulan Data/Informasi Perencanaan","title":"Pengertian data dan informasi","description":"Data kebutuhan, pasar, volume, anggaran, dokumen survei, dan jejak persetujuan perlu dikumpulkan sebagai bukti. Soal tentang “langkah pertama” biasanya meminta identifikasi data sebelum memilih alternatif.","page":"11","sourcePage":"57"},{"id":"K040","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB VIII — Identifikasi dan Pengumpulan Data/Informasi Perencanaan","title":"Data pendukung kebutuhan, pasar, anggaran, pemaketan dan dokumentasi","description":"Dokumentasikan identifikasi kebutuhan, bukti survei pasar, estimasi biaya, kesesuaian anggaran serta justifikasi pemaketan. Bukti tersebut menjelaskan mengapa keputusan perencanaan masuk akal.","page":"11","sourcePage":"57"},{"id":"K041","module":"Melakukan Perencanaan Pengadaan Barang/Jasa Pemerintah","moduleCode":"M3-RENC","chapter":"BAB IX — Penutup","title":"Simpulan; implikasi; tindak lanjut; latihan, kunci jawaban, pustaka, glosarium","description":"Gunakan simpulan untuk menegaskan konsep utama, lalu kerjakan latihan dan evaluasi tanpa melihat kunci terlebih dahulu. Kunci jawaban modul membantu memeriksa alasan; pustaka dan glosarium menjadi tempat memastikan istilah.","page":"12","sourcePage":"61"},{"id":"K042","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB I — Pendahuluan","title":"Tujuan pembelajaran, kompetensi dan indikator keberhasilan","description":"Pahami kemampuan yang dituju modul: reviu dokumen persiapan, penyusunan dokumen, penilaian kualifikasi, evaluasi, sanggah, negosiasi dan prosedur khusus. Ini membantu membedakan soal pemilihan dari soal perencanaan.","page":"12","sourcePage":"1"},{"id":"K043","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB II — Reviu Dokumen Persiapan Pengadaan","title":"Ruang lingkup reviu dokumen persiapan","description":"Pokja atau Pejabat Pengadaan menelaah kesesuaian dokumen persiapan seperti spek/KAK, rancangan kontrak dan informasi terkait sebelum proses pemilihan. Tujuannya memastikan dokumen dapat dipakai secara sah, adil dan konsisten.","page":"12","sourcePage":"5"},{"id":"K044","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB II — Reviu Dokumen Persiapan Pengadaan","title":"Tindak lanjut hasil reviu bersama pihak terkait","description":"Ketidaksesuaian dokumen perlu dibahas/dikoreksi dengan pihak yang berwenang sebelum pemilihan. Jangan menganggap reviu sama dengan memilih pemenang.","page":"12","sourcePage":"5"},{"id":"K045","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB III — Dokumen Pemilihan dan Pemberian Penjelasan","title":"Tujuan, tahapan dan komponen dokumen pemilihan","description":"Dokumen pemilihan berisi syarat, tata cara, jadwal serta metode penawaran dan evaluasi. Peserta menyusun penawaran berdasarkan ketentuan yang diumumkan, bukan informasi yang diberikan berbeda-beda.","page":"13","sourcePage":"11"},{"id":"K046","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB III — Dokumen Pemilihan dan Pemberian Penjelasan","title":"Penetapan metode pemilihan, kualifikasi, evaluasi, penyampaian penawaran","description":"Hasil penilaian harus dapat ditelusuri melalui berita acara, alasan kelulusan/gugur dan pengumuman. Tahap ini juga terkait hak peserta untuk menyampaikan keberatan sesuai aturan.","page":"13","sourcePage":"11"},{"id":"K047","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB III — Dokumen Pemilihan dan Pemberian Penjelasan","title":"Pemberian penjelasan (aanwijzing)","description":"Aanwijzing digunakan menjelaskan persyaratan dan merespons pertanyaan peserta. Perubahan substansi harus melalui mekanisme resmi sehingga seluruh peserta memperoleh informasi yang sama.","page":"13","sourcePage":"11"},{"id":"K048","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB IV — Penilaian Kualifikasi","title":"Legalitas/administrasi dan kemampuan teknis penyedia","description":"Kualifikasi mencocokkan bukti hukum/administratif dan kemampuan teknis yang relevan terhadap pekerjaan. Kelulusan tidak boleh ditentukan oleh kesan subjektif atau hanya karena penyedia pernah menang.","page":"13","sourcePage":"24"},{"id":"K049","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB IV — Penilaian Kualifikasi","title":"Prakualifikasi gagal dan tindak lanjut","description":"Prakualifikasi menilai kualifikasi sebelum penyampaian penawaran dan dapat dinyatakan gagal pada kondisi tertentu. Identifikasi penyebab kegagalan sebelum menentukan tindak lanjut yang diizinkan.","page":"14","sourcePage":"24"},{"id":"K050","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB V — Evaluasi Penawaran","title":"Evaluasi administrasi, teknis dan harga/biaya","description":"Evaluasi dilakukan berurutan sesuai metode yang ditetapkan dalam dokumen pemilihan. Penawaran termurah tidak selalu menang bila gagal pada persyaratan administrasi atau teknis.","page":"14","sourcePage":"29"},{"id":"K051","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB V — Evaluasi Penawaran","title":"Tender atau seleksi gagal beserta tindak lanjut","description":"Ketidaksesuaian dokumen perlu dibahas/dikoreksi dengan pihak yang berwenang sebelum pemilihan. Jangan menganggap reviu sama dengan memilih pemenang.","page":"14","sourcePage":"29"},{"id":"K052","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB V — Evaluasi Penawaran","title":"Penetapan dan pengumuman hasil pemilihan","description":"Hasil penilaian harus dapat ditelusuri melalui berita acara, alasan kelulusan/gugur dan pengumuman. Tahap ini juga terkait hak peserta untuk menyampaikan keberatan sesuai aturan.","page":"14","sourcePage":"29"},{"id":"K053","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB VI — Pengelolaan Sanggah","title":"Sanggah: ruang lingkup dan penanganannya","description":"Sanggah merupakan mekanisme peserta mempertanyakan hasil/proses pemilihan menurut alasan yang diizinkan. Tidak semua ketidakpuasan peserta otomatis memenuhi syarat sanggah.","page":"15","sourcePage":"35"},{"id":"K054","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB VI — Pengelolaan Sanggah","title":"Sanggah banding: persyaratan dan perbedaan","description":"Sanggah banding memiliki kondisi penggunaan khusus dan tidak berlaku untuk setiap paket. Periksa subjek, objek dan tenggat menurut aturan pelaksanaan yang tepat.","page":"15","sourcePage":"35"},{"id":"K055","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB VII — Penyusunan Daftar Penyedia","title":"Daftar/riwayat penyedia dan pemanfaatan data kinerja","description":"Daftar penyedia menyimpan informasi identitas, kemampuan dan rekam jejak untuk mendukung pengadaan. Daftar bukan surat kontrak dan tidak menjamin penyedia terpilih untuk semua pekerjaan.","page":"15","sourcePage":"41"},{"id":"K056","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB VIII — Negosiasi dalam PBJP","title":"Ruang lingkup negosiasi","description":"Negosiasi dilakukan hanya pada situasi yang dibolehkan prosedur, untuk menyepakati aspek teknis/harga. Pihak yang melakukan negosiasi dan berita acara perlu sesuai metode dan kewenangan.","page":"15","sourcePage":"44"},{"id":"K057","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB VIII — Negosiasi dalam PBJP","title":"Tujuan negosiasi dan hasil yang ingin dicapai","description":"Negosiasi dilakukan hanya pada situasi yang dibolehkan prosedur, untuk menyepakati aspek teknis/harga. Pihak yang melakukan negosiasi dan berita acara perlu sesuai metode dan kewenangan.","page":"16","sourcePage":"44"},{"id":"K058","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB VIII — Negosiasi dalam PBJP","title":"Para pihak yang berwenang melakukan negosiasi","description":"Negosiasi dilakukan hanya pada situasi yang dibolehkan prosedur, untuk menyepakati aspek teknis/harga. Pihak yang melakukan negosiasi dan berita acara perlu sesuai metode dan kewenangan.","page":"16","sourcePage":"44"},{"id":"K059","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB IX — Pengadaan dengan Persyaratan Khusus/Spesifik","title":"Pengadaan khusus termasuk keadaan darurat dan kondisi tertentu","description":"Untuk keadaan darurat atau kondisi spesifik lain, dasar hukum dan tahapan dapat berbeda dari metode biasa. Tentukan lebih dahulu dasar pengecualiannya.","page":"16","sourcePage":"50"},{"id":"K060","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB IX — Pengadaan dengan Persyaratan Khusus/Spesifik","title":"Pengadaan dengan persyaratan spesifik dan perlakuan prosedural","description":"Pengadaan khusus mencakup keadaan atau objek yang memiliki ketentuan tersendiri. Jangan mengambil aturan umum sebagai jawaban apabila soal jelas menyebut kondisi pengecualian.","page":"16","sourcePage":"50"},{"id":"K061","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB X — Risiko Pemilihan Penyedia","title":"Kualifikasi tidak valid, konflik kepentingan, evaluasi tidak objektif, sanggah","description":"Penilaian kualifikasi memeriksa kelayakan dan kemampuan pelaku usaha: izin/legalitas, pengalaman, kemampuan dan syarat spesifik menurut pekerjaan. Penyedia terdaftar tidak otomatis selalu memenuhi persyaratan paket.","page":"17","sourcePage":"65"},{"id":"K062","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB XI — Identifikasi dan Pengumpulan Data/Informasi Pemilihan","title":"Dokumen pemilihan, evaluasi, berita acara, pasar dan data pendukung","description":"Dokumen pemilihan berisi syarat, tata cara, jadwal serta metode penawaran dan evaluasi. Peserta menyusun penawaran berdasarkan ketentuan yang diumumkan, bukan informasi yang diberikan berbeda-beda.","page":"17","sourcePage":"68"},{"id":"K063","module":"Melakukan Pemilihan Penyedia Barang/Jasa Pemerintah","moduleCode":"M4-PILIH","chapter":"BAB XII — Penutup","title":"Simpulan; implikasi; tindak lanjut; kunci jawaban, pustaka, glosarium","description":"Gunakan simpulan untuk menegaskan konsep utama, lalu kerjakan latihan dan evaluasi tanpa melihat kunci terlebih dahulu. Kunci jawaban modul membantu memeriksa alasan; pustaka dan glosarium menjadi tempat memastikan istilah.","page":"17","sourcePage":"71"},{"id":"K064","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB I — Pendahuluan","title":"Tujuan dan ruang lingkup pengelolaan kontrak","description":"Pengelolaan kontrak dimulai dengan perumusan yang tepat, diteruskan ke pengendalian prestasi, pemeriksaan hasil, serah terima serta penilaian kinerja. Kenali dokumen dan wewenang pada setiap titik.","page":"17","sourcePage":"1"},{"id":"K065","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB II — Perumusan dan Pembentukan Tim Pengelola Kontrak","title":"Definisi kontrak, pihak dan tim pengelola","description":"Kontrak adalah kesepakatan tertulis sesuai ketentuan antara pejabat berwenang dengan penyedia/pelaksana. Identifikasi subjek yang menandatangani dan hasil pekerjaan sebelum memilih jenis atau bentuk kontrak.","page":"18","sourcePage":"4"},{"id":"K066","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB II — Perumusan dan Pembentukan Tim Pengelola Kontrak","title":"Jenis dan bentuk kontrak; pembayaran prestasi","description":"Jenis kontrak mengatur struktur risiko, harga atau keluaran (lumsum, harga satuan, payung dan sebagainya); bentuk kontrak adalah bukti administratif (kuitansi, SPK, surat perjanjian, surat pesanan). Kedua istilah sering sengaja dipertukarkan dalam pilihan jawaban.","page":"18","sourcePage":"4"},{"id":"K067","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB II — Perumusan dan Pembentukan Tim Pengelola Kontrak","title":"Uang muka, jaminan, garansi dan penyesuaian harga","description":"Uang muka adalah pembayaran awal dengan syarat dan jaminan menurut kontrak. Jaminan uang muka jangan disamakan dengan jaminan penawaran, pelaksanaan atau pemeliharaan.","page":"18","sourcePage":"4"},{"id":"K068","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB II — Perumusan dan Pembentukan Tim Pengelola Kontrak","title":"Tahapan perumusan kontrak","description":"Rancangan kontrak perlu mencerminkan ruang lingkup, keluaran, harga, waktu, pembayaran, risiko dan mekanisme perubahan. Jangan menetapkan bentuk dokumen tanpa memeriksa objek serta nilai pengadaan.","page":"19","sourcePage":"4"},{"id":"K069","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB II — Perumusan dan Pembentukan Tim Pengelola Kontrak","title":"Bentuk bukti pembelian, kuitansi, surat pesanan dan SPK","description":"Barang/Jasa Lainnya dengan nilai tertentu dapat menggunakan bukti pembelian, kuitansi, SPK atau surat perjanjian; batasnya berbeda dari konstruksi dan konsultansi. Lihat tabel pembanding 2025.","page":"19","sourcePage":"4"},{"id":"K070","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB III — Pengendalian Kontrak","title":"Pengendalian kemajuan pekerjaan, waktu, mutu, biaya","description":"Pengendalian mengawasi waktu, volume, mutu, biaya, pembayaran dan risiko perubahan pekerjaan. Kurva S/jadwal serta laporan kemajuan membantu memantau progres; BAST adalah dokumen serah terima, bukan instrumen utama kendali kemajuan.","page":"19","sourcePage":"27"},{"id":"K071","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB III — Pengendalian Kontrak","title":"Instrumen pengendalian seperti Kurva S dan laporan kemajuan","description":"Pengendalian mengawasi waktu, volume, mutu, biaya, pembayaran dan risiko perubahan pekerjaan. Kurva S/jadwal serta laporan kemajuan membantu memantau progres; BAST adalah dokumen serah terima, bukan instrumen utama kendali kemajuan.","page":"19","sourcePage":"27"},{"id":"K072","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB IV — Serah Terima Hasil Pekerjaan","title":"Pemeriksaan hasil, penyelesaian kewajiban, serah terima dan berita acara","description":"Hasil pekerjaan diperiksa sesuai kontrak dan berita acara; penerimaan tidak otomatis sah jika volume atau mutu tidak terpenuhi. Serah terima dan pembayaran mempunyai peran serta bukti masing-masing.","page":"20","sourcePage":"33"},{"id":"K073","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB V — Evaluasi Kinerja Penyedia","title":"Konsep dasar dan tujuan penilaian kinerja","description":"Penilaian kinerja penyedia adalah evaluasi berbasis hasil pelaksanaan kontrak untuk mendukung akuntabilitas dan pembinaan penyedia. Nilai harus merujuk pada bukti kualitas, ketepatan waktu dan pelaksanaan.","page":"20","sourcePage":"37"},{"id":"K074","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB V — Evaluasi Kinerja Penyedia","title":"Tata cara, aspek dan indikator penilaian penyedia","description":"Nilai kinerja harus bersumber pada bukti pelaksanaan, bukan persepsi sepihak. Catatan keterlambatan, mutu, dan pelaksanaan administratif dapat menjadi sumber evaluasi.","page":"20","sourcePage":"37"},{"id":"K075","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB VI — Risiko Pengelolaan Kontrak","title":"Risiko keterlambatan, tidak sesuai spesifikasi, sengketa dan pengendalian","description":"Risiko kontrak berupa keterlambatan, hasil tidak sesuai, perubahan lingkup, gagal bayar atau sengketa. Mitigasi perlu diarahkan ke penyebab: monitoring, komunikasi tertulis, koreksi pekerjaan dan dokumentasi.","page":"20","sourcePage":"42"},{"id":"K076","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB VII — Identifikasi dan Pengumpulan Data/Informasi Kontrak","title":"Dokumen kontrak, progres, pembayaran, perubahan, jaminan, BAST","description":"Jaminan penawaran, sanggah banding, pelaksanaan, uang muka dan pemeliharaan memiliki fungsi dan prasyarat berbeda. Angka persen baru dihitung setelah dicek apakah jenis jaminan memang diwajibkan.","page":"21","sourcePage":"46"},{"id":"K077","module":"Mengelola Kontrak PBJP","moduleCode":"M5-KON","chapter":"BAB VIII — Penutup","title":"Simpulan; implikasi; tindak lanjut; kunci jawaban, pustaka, glosarium","description":"Gunakan simpulan untuk menegaskan konsep utama, lalu kerjakan latihan dan evaluasi tanpa melihat kunci terlebih dahulu. Kunci jawaban modul membantu memeriksa alasan; pustaka dan glosarium menjadi tempat memastikan istilah.","page":"21","sourcePage":"50"},{"id":"K078","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB I — Pendahuluan","title":"Ruang lingkup swakelola dan empat tipe penyelenggara","description":"Tipe I oleh instansi penanggung jawab anggaran; Tipe II oleh instansi pemerintah lain; Tipe III melibatkan Ormas; Tipe IV oleh kelompok masyarakat. Detail perencanaan dan pengawasan mengikuti tipe, jadi jangan hanya menghafal siapa pelaksananya.","page":"21","sourcePage":"1"},{"id":"K079","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB II — Perencanaan PBJP secara Swakelola","title":"Tujuan swakelola: partisipasi, optimalisasi sumber daya, efektivitas","description":"Swakelola dapat dipilih untuk optimalisasi sumber daya, pemberdayaan dan partisipasi masyarakat, serta kebutuhan tertentu yang tidak tersedia/diminati pelaku usaha. Ini tidak berarti “wajib swakelola” pada setiap paket.","page":"21","sourcePage":"4"},{"id":"K080","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB II — Perencanaan PBJP secara Swakelola","title":"Kriteria barang/jasa yang dapat diswakelolakan","description":"Kriteria kelayakan swakelola bergantung sifat kebutuhan, pelaksana dan ketersediaan penyedia. Pekerjaan tertentu dapat dilaksanakan Ormas/Pokmas jika sesuai aturan dan kapasitas pelaksana.","page":"22","sourcePage":"4"},{"id":"K081","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB II — Perencanaan PBJP secara Swakelola","title":"Tahapan perencanaan swakelola","description":"Perencanaan menetapkan tujuan, cara, tipe, sasaran dan kebutuhan sumber daya. Penetapan tipe dibedakan dari penetapan tim penyelenggara pada persiapan.","page":"22","sourcePage":"4"},{"id":"K082","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB III — Persiapan PBJP secara Swakelola","title":"Penetapan penyelenggara dan tim","description":"Penyelenggara terdiri dari perencana, pelaksana dan pengawas sesuai tipe. Tanyakan siapa bertugas menetapkan, melaksanakan, memeriksa dan menerima hasil pada kondisi yang ditanyakan.","page":"22","sourcePage":"15"},{"id":"K083","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB III — Persiapan PBJP secara Swakelola","title":"Rencana kegiatan dan jadwal","description":"Rencana kegiatan merinci keluaran, tugas, sumber daya, lokasi dan jadwal. Rencana harus dapat diuji kemajuan dan hasilnya.","page":"22","sourcePage":"15"},{"id":"K084","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB III — Persiapan PBJP secara Swakelola","title":"Reviu spesifikasi teknis/KAK serta RAB","description":"Reviu spesifikasi/KAK memastikan keluaran, lingkup dan penerima manfaat jelas. Tanpa KAK yang dapat diukur, tim pengawas sulit menyatakan pekerjaan selesai.","page":"23","sourcePage":"15"},{"id":"K085","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB III — Persiapan PBJP secara Swakelola","title":"Finalisasi dan penandatanganan kontrak menurut tipe","description":"Kumpulkan proposal, kesepakatan, KAK, RAB, struktur tim, jadwal, catatan pengawasan, pembayaran dan serah terima. Data membantu menilai pelaksanaan serta kelayakan swakelola.","page":"23","sourcePage":"15"},{"id":"K086","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB IV — Pelaksanaan PBJP secara Swakelola","title":"Pelaksanaan menurut empat tipe swakelola","description":"Tim pelaksana menjalankan pekerjaan sesuai kegiatan/KAK, mengatur bahan/alat dan melaporkan kemajuan. Barang/jasa pendukung tetap mengikuti ketentuan pembeliannya.","page":"23","sourcePage":"26"},{"id":"K087","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB IV — Pelaksanaan PBJP secara Swakelola","title":"Pengawasan teknis, administrasi dan keuangan","description":"Pengawasan mencakup teknis, administrasi dan keuangan. Pilihan jawaban “hanya pengawasan hasil” atau “hanya keuangan” biasanya terlalu sempit.","page":"23","sourcePage":"26"},{"id":"K088","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB IV — Pelaksanaan PBJP secara Swakelola","title":"Serah terima hasil pekerjaan dan pembayaran","description":"Hasil diverifikasi lalu diserahkan dengan bukti sesuai proses. Serah terima harus mencerminkan keluaran nyata, bukan hanya selesai membelanjakan anggaran.","page":"24","sourcePage":"26"},{"id":"K089","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB V — Risiko Pengelolaan Swakelola","title":"Risiko ketidaksesuaian tipe/tim, RAB, pelaksanaan dan pelaporan","description":"Risiko swakelola berupa tim tidak kompeten, salah tipe, RAB tidak realistis, bukti lemah, keterlambatan dan pengawasan minim. Mitigasinya meliputi penilaian kapasitas, dokumen rencana dan supervisi berkala.","page":"24","sourcePage":"44"},{"id":"K090","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB VI — Identifikasi dan Pengumpulan Data/Informasi Swakelola","title":"Kebutuhan, proposal/kesepakatan, jadwal, laporan, bukti serah terima","description":"Jadwal menyelaraskan pekerjaan dengan sumber daya dan target layanan. Jika terdapat keterlambatan, dampaknya dinilai bersama kualitas serta risiko biaya.","page":"24","sourcePage":"49"},{"id":"K091","module":"Mengelola PBJP secara Swakelola","moduleCode":"M6-SWAK","chapter":"BAB VII — Penutup","title":"Kesimpulan; implikasi; tindak lanjut; kunci jawaban, pustaka, glosarium","description":"Baca kesimpulan bersama indikator pembelajaran, lalu uji satu kasus sederhana. Glosarium berguna saat menemukan istilah teknis yang mirip tetapi berbeda makna.","page":"1","sourcePage":"53"}],"modules":[{"code":"PENGANTAR PENGADAAN BARANG/JASA","name":"Pengantar Pengadaan Barang/Jasa Pemerintah","url":"materi/pengantar.pdf"},{"code":"MANAJEMEN RANTAI PASOK","name":"Manajemen Rantai Pasok","url":"materi/rantai-pasok.pdf"},{"code":"PERENCANAAN PENGADAAN","name":"Perencanaan Pengadaan Barang/Jasa","url":"materi/perencanaan.pdf"},{"code":"PEMILIHAN PENYEDIA","name":"Pemilihan Penyedia","url":"materi/pemilihan.pdf"},{"code":"PENGELOLAAN KONTRAK","name":"Pengelolaan Kontrak","url":"materi/kontrak.pdf"},{"code":"PENGELOLAAN SWAKELOLA","name":"Pengelolaan Swakelola","url":"materi/swakelola.pdf"}],"resources":[{"label":"Kamus Pembahasan 91 Topik","url":"materi/kamus-pembahasan.pdf"},{"label":"Quick Exam Book","url":"materi/quick-exam.pdf"},{"label":"Bank Soal Terpadu F4","url":"materi/bank-soal-terpadu.pdf"},{"label":"Try Out Historis","url":"materi/tryout-historis.pdf"}]};</script>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s), DATA=APP_DATA, QS=DATA.questions, MODS=DATA.modules;
const KEY='PBJ_LEVEL1_OFFLINE_V1';
const COLORS=['#0e8275','#476aa7','#9b6c24','#7250a1','#bb6656','#427a8d'];
let state={view:'home',bankQuery:'',bankMod:'all',bankStatus:'all',bankPage:0,glossQuery:'',glossMod:'all',setup:{mode:'study',pool:'safe',module:'all',chapter:'all',type:'all',count:20,customCount:20,minutes:60,customMinutes:60},modal:null,sidebar:false};
let saved={attempts:{},bookmarks:[],difficult:[],notes:{},history:[],session:null,theme:'light'};
try{const x=localStorage.getItem(KEY);if(x)saved=Object.assign(saved,JSON.parse(x))}catch(e){console.warn('Storage unavailable',e)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){toast('Penyimpanan browser terbatas. Ekspor progres agar tidak hilang.')}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function snip(t,n=150){t=String(t??'');return t.length>n?t.slice(0,n-1)+'…':t}
function fmt(n){return Number(n||0).toLocaleString('id-ID')}
function pad(x){return String(x).padStart(2,'0')}
function msTime(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);return h?`${pad(h)}:${pad(m)}:${pad(sec)}`:`${pad(m)}:${pad(sec)}`}
function moduleName(code){return MODS.find(x=>x.code===code)?.name||code}
function row(id){return QS.find(x=>x.id===id)}
function badge(t,typ='gray'){return `<span class="pill ${typ}">${esc(t)}</span>`}
function classify(q){if(q.qa==='benturan')return {label:'Kunci benturan',color:'warn'};if(q.qa==='pengecualian')return {label:'Kunci tidak pasti',color:'warn'};if(q.qa==='butuh konfirmasi')return {label:'Perlu konfirmasi',color:'warn'};if(q.qa==='kunci_tidak_tersedia')return {label:'Kunci tidak tersedia',color:'warn'};if(q.origin==='historis')return {label:'Benar pada try out 2025',color:'blue'};return {label:'Kunci pemateri',color:'gray'}}
function scores(){let a=Object.values(saved.attempts),sc=a.filter(x=>x.scored),n=sc.reduce((k,x)=>k+x.right,0),total=sc.reduce((k,x)=>k+x.scored,0);return{attempted:a.length,scored:total,right:n,accuracy:total?Math.round(n/total*100):0}}
function moduleStats(module){let qs=QS.filter(x=>x.module===module),seen=qs.filter(x=>saved.attempts[x.id]),scored=seen.filter(x=>saved.attempts[x.id].scored),r=scored.reduce((z,q)=>z+saved.attempts[q.id].right,0),den=scored.reduce((z,q)=>z+saved.attempts[q.id].scored,0);return{total:qs.length,seen:seen.length,accuracy:den?Math.round(100*r/den):null}}
function qBadge(q){let c=classify(q);return badge(c.label,c.color)}
function go(v){if(saved.session&&state.view==='quiz'&&v!=='quiz'){/* session remains resumable */}state.view=v;state.modal=null;state.sidebar=false;closeSidebarMenu();closeQuizNavigator();render();scrollTo({top:0,behavior:'instant'});location.hash='#/'+v}
function shell(title,subtitle,extra=''){return `<div class="heading"><div><div class="eyebrow">PBJ LEVEL 1 / RUANG BELAJAR</div><h1>${title}</h1><p class="subhead">${subtitle}</p></div>${extra}</div>`}
function statCard(val,label,hint=''){return `<div class="card stat"><strong>${val}</strong><small>${label}</small>${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function home(){const sc=scores();return `<div class="hero"><div><div class="eyebrow">Belajar terstruktur, bukan sekadar hafalan</div><h1>Siap menghadapi sertifikasi PBJ Level 1?</h1><p>Berlatih dari <b>294 soal sumber</b>, pahami pembahasannya, dan temukan kelemahan per kompetensi. Semua tersedia secara lokal di browser.</p><div class="actions"><button class="btn white" data-action="go" data-view="setup">Mulai latihan →</button>${saved.session?`<button class="btn" style="background:rgba(255,255,255,.16);border-color:#ffffff55" data-action="resume">Lanjutkan sesi</button>`:''}</div></div><div class="hero-art"><div class="big">📖</div></div></div>
<div class="stats">${statCard('294','Soal dari sumber asli','194 pemateri · 100 try out')}${statCard(fmt(sc.attempted),'Soal pernah dicoba')}${statCard(sc.scored?sc.accuracy+'%':'—','Akurasi yang dapat dinilai')}${statCard(fmt(saved.bookmarks.length),'Soal ditandai')}</div>
<div class="sections-head"><h2>Belajar per kompetensi</h2><button class="btn ghost sm" data-action="go" data-view="bank">Lihat semua soal →</button></div><div class="module-grid">${MODS.map((m,i)=>{let st=moduleStats(m.code);return `<div class="card module" role="button" tabindex="0" data-action="modulePractice" data-module="${esc(m.code)}"><div style="display:flex;align-items:center;justify-content:space-between"><div class="module-ic" style="background:${COLORS[i]}1c;color:${COLORS[i]}">${['◈','↗','▤','▥','▣','◎'][i]}</div><span class="label">${fmt(st.total)} soal</span></div><div class="module-name">${esc(m.name)}</div><div class="progress thin"><i style="width:${st.total?st.seen/st.total*100:0}%"></i></div><div class="foot"><span>${fmt(st.seen)} sudah dicoba</span><span>Latihan →</span></div></div>`}).join('')}</div>
<div class="grid-2" style="margin-top:20px"><div class="card"><h3>🎯 Strategi latihan yang disarankan</h3><p class="muted tiny">1. Kuasai konsep di kamus. 2. Kerjakan 20 soal per topik. 3. Tinjau pembahasan dan soal yang ditandai. 4. Jalankan try out 50–100 soal dengan timer.</p><div class="actions"><button class="btn sm" data-action="quickStart">Latihan cepat 10 soal</button><button class="btn ghost sm" data-action="go" data-view="kamus">Pelajari kamus</button></div></div><div class="callout"><b>⚠️ Kunci jawaban perlu dibaca secara kritis.</b><p>37 soal pemateri memiliki catatan QA (7 benturan, 25 butuh konfirmasi, 5 pengecualian), sedangkan 27 soal historis tidak menampilkan kunci resmi. Soal ini tetap tersedia untuk telaah, tetapi tidak ikut penilaian otomatis.</p><button class="btn sm subtle" style="margin-top:10px" data-action="go" data-view="help">Pelajari aturan penilaian</button></div></div>`}
function setupAvailable(sp){return QS.filter(q=>(sp.pool==='all'||q.scorable)&&(sp.module==='all'||q.module===sp.module)&&(sp.type==='all'||q.origin===sp.type)&&(sp.chapter==='all'||q.chapter===sp.chapter))}
function selectedQuestionCount(sp,available){if(!available)return 0;if(sp.count==='all')return available;let requested=sp.count==='custom'?Number(sp.customCount):Number(sp.count);if(!Number.isFinite(requested)||requested<1)return 0;return Math.min(Math.floor(requested),available)}
function selectedDuration(sp){let m=sp.minutes==='custom'?Number(sp.customMinutes):Number(sp.minutes);if(!Number.isFinite(m)||m<0)return 0;return Math.min(720,Math.floor(m))}
function fmtDuration(m){if(!m)return 'Tanpa batas waktu';return `${m} menit${m>=60?' ('+(m/60).toLocaleString('id-ID',{maximumFractionDigits:2})+' jam)':''}`}
function shuffleItems(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function setup(){let sp=state.setup,base=QS.filter(q=>(sp.pool==='all'||q.scorable)&&(sp.module==='all'||q.module===sp.module)&&(sp.type==='all'||q.origin===sp.type));let chapters=[...new Set(base.map(x=>x.chapter))].sort();if(sp.chapter!=='all'&&!chapters.includes(sp.chapter))sp.chapter='all';let available=setupAvailable(sp), chosen=selectedQuestionCount(sp,available.length), duration=selectedDuration(sp), requested=sp.count==='custom'?Number(sp.customCount):Number(sp.count);let restricted=sp.module!=='all'||sp.type!=='all'||sp.chapter!=='all'||sp.pool!=='all';let note=(sp.count!=='all'&&requested>available.length)?`Jumlah diminta ${requested} soal, namun filter saat ini hanya memiliki ${available.length}. Sesi akan menggunakan maksimal ${available.length} soal.`:'';
return `${shell('Atur sesi latihan','Atur jumlah soal dengan tepat, pilih seluruh bank soal, dan atur timer untuk kedua mode latihan.')}
<div class="setup-mobile-summary" aria-live="polite"><div><div class="micro">Sesi Anda</div><strong id="mobileSetupCount">${chosen}</strong><div class="micro">soal terpilih</div></div><div class="micro" style="text-align:right">⏱ <b id="mobileSetupDuration">${fmtDuration(duration)}</b><br>${sp.mode==='exam'?'Simulasi try out':'Belajar dengan pembahasan'}</div></div>
<div class="grid-2" style="align-items:start;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr)"><div class="card"><h2>1. Mode belajar</h2><div class="radio-cards setup-section"><div class="radio-card ${sp.mode==='study'?'selected':''}" tabindex="0" role="button" aria-pressed="${sp.mode==='study'}" data-action="setupVal" data-field="mode" data-value="study"><b>📘 Belajar dengan pembahasan</b><small>Periksa jawaban satu per satu dan lihat alasannya.</small></div><div class="radio-card ${sp.mode==='exam'?'selected':''}" tabindex="0" role="button" aria-pressed="${sp.mode==='exam'}" data-action="setupVal" data-field="mode" data-value="exam"><b>⏱ Simulasi try out</b><small>Jawaban dan pembahasan diperiksa setelah sesi selesai.</small></div></div>
<h2>2. Pilih soal</h2>
<div class="setup-allbar"><div><b>Ingin mengerjakan seluruh bank soal?</b><div class="tiny muted">Sekali klik: 294 soal, semua kompetensi, semua BAB dan kedua sumber.</div></div><button class="btn sm" data-action="all294">Gunakan seluruh 294 soal</button></div>
<div class="fieldset"><div class="field"><label>Kelompok soal</label><select data-setup="pool"><option value="safe" ${sp.pool==='safe'?'selected':''}>Terukur (230 soal berkunci tanpa QA)</option><option value="all" ${sp.pool==='all'?'selected':''}>Seluruh 294 soal (termasuk audit)</option></select></div><div class="field"><label>Asal soal</label><select data-setup="type"><option value="all" ${sp.type==='all'?'selected':''}>Pemateri + e-learning</option><option value="pemateri" ${sp.type==='pemateri'?'selected':''}>Soal pemateri</option><option value="historis" ${sp.type==='historis'?'selected':''}>Try out e-learning 2025</option></select></div><div class="field"><label>Kompetensi</label><select data-setup="module"><option value="all" ${sp.module==='all'?'selected':''}>Semua kompetensi</option>${MODS.map(m=>`<option ${sp.module===m.code?'selected':''} value="${esc(m.code)}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>BAB / subtopik kandidat</label><select data-setup="chapter"><option value="all">Semua bab</option>${chapters.map(c=>`<option ${sp.chapter===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Jumlah soal yang dikerjakan</label><select data-setup="count"><option value="all" ${sp.count==='all'?'selected':''}>Semua sesuai filter (${available.length} soal)</option>${[10,20,30,50,100,194,294].map(n=>`<option value="${n}" ${String(sp.count)===String(n)?'selected':''}>${n} soal</option>`).join('')}<option value="custom" ${sp.count==='custom'?'selected':''}>Jumlah sendiri...</option></select>${sp.count==='custom'?`<input type="number" data-setup-input="customCount" inputmode="numeric" min="1" max="294" step="1" value="${esc(sp.customCount??20)}" aria-label="Masukkan jumlah soal"/><small class="tiny muted">Masukkan 1–294. Tidak boleh melebihi soal yang lolos filter.</small>`:''}</div><div class="field"><label>Durasi / timer (untuk kedua mode)</label><select data-setup="minutes"><option value="0" ${String(sp.minutes)==='0'?'selected':''}>Tanpa batas waktu</option>${[15,30,45,60,90,120,180,240,360].map(n=>`<option value="${n}" ${String(sp.minutes)===String(n)?'selected':''}>${n} menit</option>`).join('')}<option value="custom" ${sp.minutes==='custom'?'selected':''}>Atur menit sendiri...</option></select>${sp.minutes==='custom'?`<input type="number" data-setup-input="customMinutes" inputmode="numeric" min="1" max="720" step="1" value="${esc(sp.customMinutes??60)}" aria-label="Masukkan durasi dalam menit"/><small class="tiny muted">1–720 menit; pilih Tanpa batas waktu untuk belajar santai.</small>`:''}</div></div>
<div class="actions"><button class="btn" data-action="startSession" ${chosen?'':'disabled'}>Mulai ${sp.mode==='exam'?'try out':'belajar'} →</button>${saved.session?`<button class="btn subtle" data-action="resume">Lanjutkan sesi tersimpan</button>`:''}</div></div>
<div class="setup-right"><h3>Ringkasan pilihan Anda</h3><div id="setupTotal" style="font-size:43px;font-weight:850;letter-spacing:-2px">${chosen}</div><p>soal akan diambil acak dari <strong>${available.length}</strong> soal yang memenuhi filter saat ini.</p><div class="divider"></div><p><b id="setupTime">⏱ ${fmtDuration(duration)}</b> · ${sp.mode==='study'?'mode belajar':'mode simulasi'}</p><div id="setupCountWarning">${note?`<div class="warning">${esc(note)}</div>`:''}${restricted?`<div class="tiny muted" style="margin-top:9px">Filter sedang aktif. Untuk mendapat semua 294 soal, tekan <b>Gunakan seluruh 294 soal</b> di sebelah kiri.</div>`:''}</div><div class="divider"></div><p>${sp.pool==='safe'?'✓ Hanya soal berkunci tanpa tanda QA khusus masuk dalam sesi.':'⚠ Soal bermasalah tetap dapat dipelajari tanpa dipaksakan kuncinya.'}</p><p>${sp.mode==='exam'?'📝 Penilaian dan pembahasan tampil setelah sesi selesai.':'📖 Pembahasan muncul sesudah Periksa Jawaban.'}</p><div class="divider"></div><p><b>Petunjuk:</b> ketik 1–4 untuk memilih opsi. Progres disimpan lokal di browser.</p></div></div>`}
function refreshSetupPreview(){if(state.view!=='setup')return;let s=state.setup,available=setupAvailable(s),n=selectedQuestionCount(s,available.length);let total=document.getElementById('setupTotal');if(total)total.textContent=String(n);let mob=document.getElementById('mobileSetupCount');if(mob)mob.textContent=String(n);let mt=document.getElementById('mobileSetupDuration');if(mt)mt.textContent=fmtDuration(selectedDuration(s));let tim=document.getElementById('setupTime');if(tim)tim.textContent='⏱ '+fmtDuration(selectedDuration(s));let warn=document.getElementById('setupCountWarning');if(warn){let requested=s.count==='custom'?Number(s.customCount):Number(s.count);let html='';if(s.count!=='all'&&requested>available.length)html+=`<div class="warning">Diminta ${requested} soal, tetapi filter hanya berisi ${available.length}. Maksimal ${available.length} yang akan digunakan.</div>`;if(s.count==='custom'&&(!Number.isFinite(requested)||requested<1))html+='<div class="warning">Masukkan jumlah soal minimal 1.</div>';warn.innerHTML=html}let start=document.querySelector('[data-action="startSession"]');if(start)start.disabled=n===0}
function getPool(ids){return ids.map(row).filter(Boolean)}
function startSession(ids, mode){let session={ids,idx:0,answers:{},reviewed:{},marked:[],mode,startedAt:Date.now(),limit:selectedDuration(state.setup)*60,finished:false};saved.session=session;persist();go('quiz')}
function mobileQuizControls(s,q,choice,reviewed){let next=s.idx>=s.ids.length-1;let mustCheck=s.mode==='study'&&!reviewed;let primary=mustCheck?'Periksa':next?'Selesai':'Berikutnya →';let action=mustCheck?'reviewAnswer':'nextQ';let disabled=mustCheck&&!choice?'disabled':'';let ans=Object.keys(s.answers).length;return `<div class="mobile-quiz-dock" aria-label="Navigasi latihan ponsel"><button class="btn subtle" data-action="prevQ" ${s.idx===0?'disabled':''}>← Kembali</button><button class="jump-trigger" data-action="openQuizNav" aria-label="Buka daftar nomor soal">▦<br><small>Soal ${s.idx+1}/${s.ids.length}</small></button><button class="btn" data-action="${action}" ${disabled}>${primary}</button></div><div class="quiz-sheet-overlay" data-action="closeQuizNav"></div><section class="quiz-sheet" id="mobileQuizSheet" role="dialog" aria-label="Navigasi nomor soal"><div class="quiz-sheet-head"><div><strong>Daftar soal</strong><div class="tiny muted">${ans} terjawab dari ${s.ids.length} · Pilih nomor</div></div><button class="icon-btn" data-action="closeQuizNav" aria-label="Tutup daftar soal">✕</button></div><div class="progress thin"><i style="width:${100*ans/s.ids.length}%"></i></div><div class="jump-form"><label class="tiny muted" for="mobileJumpNumber">Lompat ke nomor:</label><input type="number" id="mobileJumpNumber" min="1" max="${s.ids.length}" inputmode="numeric" value="${s.idx+1}" aria-label="Nomor soal tujuan"/><button class="btn sm" data-action="jumpNumber">Buka</button></div><div class="qgrid" aria-label="Daftar nomor soal">${s.ids.map((id,i)=>`<button aria-label="Soal ${i+1}${s.answers[id]?', terjawab':''}" class="${s.idx===i?'current':''} ${s.answers[id]?'done':''} ${saved.bookmarks.includes(id)?'marked':''}" data-action="jumpQ" data-index="${i}">${i+1}</button>`).join('')}</div><div class="jump-actions"><span class="tiny muted">Tanda hijau = terjawab</span><button class="btn subtle sm" data-action="finishSession">Selesaikan sesi</button></div></section>`}
function closeSidebarMenu(){document.body.classList.remove('menu-open');let x=document.getElementById('sidebar');if(x){x.classList.remove('open');if(window.innerWidth<=850)x.setAttribute('aria-hidden','true');else x.removeAttribute('aria-hidden')}let b=document.querySelector('[data-action="sidebar"]');if(b)b.setAttribute('aria-expanded','false')}
function openSidebarMenu(){closeQuizNavigator();document.body.classList.add('menu-open');let x=document.getElementById('sidebar');if(x){x.classList.add('open');x.removeAttribute('aria-hidden')}let b=document.querySelector('[data-action="sidebar"]');if(b)b.setAttribute('aria-expanded','true')}
function closeQuizNavigator(){document.body.classList.remove('quiz-sheet-open')}
function openQuizNavigator(){closeSidebarMenu();document.body.classList.add('quiz-sheet-open');let input=document.getElementById('mobileJumpNumber');if(input){input.focus({preventScroll:true});input.select()}}

function quiz(){let s=saved.session;if(!s||s.finished)return `<div class="card"><h2>Tidak ada sesi aktif</h2><button class="btn" data-action="go" data-view="setup">Buat sesi baru</button></div>`;let q=row(s.ids[s.idx]);if(!q)return `<p>Soal tidak ditemukan.</p>`;let choice=s.answers[q.id]||'',reviewed=!!s.reviewed[q.id],show=reviewed&&s.mode==='study';let answered=Object.keys(s.answers).length;return `<div class="quiz-shell"><div class="quizbar"><div>${badge(s.mode==='study'?'Mode pembelajaran':'Simulasi try out','blue')} ${badge(`${s.idx+1} / ${s.ids.length} soal`)} </div><div class="controls"><span class="tiny muted">${answered} terjawab</span>${s.limit?`<span class="pill warn" id="timer">${msTime(Math.max(0,s.limit-Math.floor((Date.now()-s.startedAt)/1000)))}</span>`:`<span class="pill">Tanpa timer</span>`}<button class="btn subtle sm" data-action="finishSession">Selesaikan sesi</button></div></div><div class="progress" style="margin-bottom:14px"><i style="width:${100*(s.idx+1)/s.ids.length}%"></i></div><div class="quiz-layout"><article class="card question-card"><div class="item-top"><span class="qid">${esc(q.id)} · ${q.origin==='pemateri'?'Soal Pemateri':'Try out e-learning 2025'}</span>${qBadge(q)}</div><div class="tiny muted">${esc(moduleName(q.module))} / ${esc(q.chapter)}</div><div class="question-title">${esc(q.text)}</div>${q.options.map((opt,i)=>{let letter='ABCD'[i];return `<button class="option ${choice===letter?'selected':''} ${show&&q.scorable&&letter===q.key?'correct':''} ${show&&q.scorable&&choice===letter&&choice!==q.key?'incorrect':''}" data-action="answer" data-option="${letter}" ${show?'disabled':''}><span class="letter">${letter}</span><span>${esc(opt||'(Opsi tidak terbaca pada sumber)')}</span></button>`}).join('')}
${q.origin==='historis'?`<details class="warning historical-note" style="margin-top:12px"><summary>Sumber soal try out 2025 dan kunci jawaban</summary><p>Teks try out 2025 telah diperbarui dari PDF lengkap: 100 soal dan masing-masing 4 opsi telah diperiksa. Kunci untuk 27 jawaban historis yang salah belum tersedia.</p></details>`:''}
<div class="controls" style="margin-top:14px"><button class="btn subtle sm" data-action="mark" data-id="${q.id}">${saved.bookmarks.includes(q.id)?'★ Ditandai':'☆ Tandai soal'}</button><button class="btn subtle sm" data-action="difficult" data-id="${q.id}">${saved.difficult.includes(q.id)?'◆ Soal sulit':'◇ Tandai sulit'}</button><button class="btn ghost sm" data-action="questionDetail" data-id="${q.id}">Sumber & catatan</button></div>
${s.mode==='study'&&!reviewed?`<div style="margin-top:17px"><button class="btn" data-action="reviewAnswer" ${!choice?'disabled':''}>Periksa Jawaban</button></div>`:''}${show?feedback(q,choice):''}
<div class="quiz-footer"><button class="btn subtle" data-action="prevQ" ${s.idx===0?'disabled':''}>← Sebelumnya</button><button class="btn" data-action="nextQ">${s.idx===s.ids.length-1?'Selesaikan sesi':'Soal berikutnya →'}</button></div></article><aside class="card quiz-panel"><h3>Navigasi soal</h3><p class="tiny muted">Klik nomor untuk melompat ke soal lain.</p><div class="qgrid">${s.ids.map((id,i)=>`<button aria-label="Soal ${i+1}" class="${s.idx===i?'current':''} ${s.answers[id]?'done':''} ${saved.bookmarks.includes(id)?'marked':''}" data-action="jumpQ" data-index="${i}">${i+1}</button>`).join('')}</div><div class="divider"></div><div class="tiny muted">${s.mode==='study'?'Pembahasan akan terbuka setelah jawaban diperiksa.':'Pada mode try out, jawaban tidak dibocorkan sebelum Anda mengakhiri sesi.'}</div>${s.mode==='exam'?'<div class="warning" style="margin-top:12px">Soal tanpa kunci pasti tidak dimasukkan ke skor otomatis.</div>':''}</aside></div>${mobileQuizControls(s,q,choice,reviewed)}</div>`}
function feedback(q,chosen){let c=classify(q),keyStr=q.key?`<b>${esc(q.key)}. ${esc(q.options['ABCD'.indexOf(q.key)])}</b>`:'Tidak tersedia / belum dipastikan';let evalText=q.scorable?(chosen===q.key?'Jawaban Anda sesuai kunci yang tersedia.':'Jawaban Anda berbeda dari kunci yang tersedia.'):'Soal ini tidak dinilai otomatis karena kunci memerlukan pemeriksaan.';return `<div class="feedback"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h3>📖 Pembahasan</h3>${qBadge(q)}</div><p>${esc(evalText)}</p><div class="choice-summary"><b>Acuan sumber:</b> ${keyStr}${q.origin==='historis'&&q.historicalResult==='benar'?'<br><span class="tiny">Benar berdasarkan ulasan e-learning tahun 2025, bukan pemeriksaan peraturan 2026.</span>':''}</div><div class="details">${q.reason?`<p><b>Alasan / pembahasan:</b> ${esc(q.reason)}</p>`:`<p class="muted">Pembahasan terperinci untuk pertanyaan ini belum tersedia di sumber audit. Gunakan modul dan kamus untuk menelusuri konsepnya.</p>`}${q.alternatives?`<p><b>Opsi pembanding:</b> ${esc(q.alternatives)}</p>`:''}${q.legal?`<p><b>Catatan peraturan audit terdahulu:</b> ${esc(q.legal)}</p>`:''}${q.qa?`<p class="warning"><b>Catatan QA:</b> ${esc(q.qaDetail||'Kunci memerlukan verifikasi.')}${q.origin==='historis'?' Pilihan peserta pada try out 2025: '+esc(q.historicalChoice)+' (salah).':''}</p>`:''}${q.reference?`<p><b>Rujukan modul terdahulu:</b> ${esc(q.reference)}</p>`:''}${q.reasonOrigin?`<p class="tiny muted">Sumber ulasan: ${esc(q.reasonOrigin)}</p>`:''}<div class="actions"><button class="btn sm ghost" data-action="questionDetail" data-id="${q.id}">Lihat sumber & catatan</button>${q.moduleLink?`<a target="_blank" rel="noopener" class="btn sm subtle" href="${esc(q.moduleLink)}">Buka modul ↗</a>`:''}</div></div></div>`}
function bank(){let f=filteredBank();let start=state.bankPage*20,page=f.slice(start,start+20);return `${shell('Bank Soal Terpadu','Cari seluruh 294 soal berdasarkan kata kunci, kompetensi, BAB, ID soal, atau status verifikasi.')}<div class="searchbar"><input class="search" data-search="bankQuery" placeholder="Cari HPS, Tender Cepat, T100-005, Swakelola…" value="${esc(state.bankQuery)}" aria-label="Cari soal"/><select class="search" data-select="bankMod"><option value="all">Semua kompetensi</option>${MODS.map(m=>`<option ${state.bankMod===m.code?'selected':''} value="${esc(m.code)}">${esc(m.name)}</option>`).join('')}</select><select class="search" data-select="bankStatus"><option value="all">Semua status</option><option value="safe" ${state.bankStatus==='safe'?'selected':''}>Berkunci tanpa QA</option><option value="risk" ${state.bankStatus==='risk'?'selected':''}>Butuh pemeriksaan</option><option value="marked" ${state.bankStatus==='marked'?'selected':''}>Saya tandai</option><option value="difficult" ${state.bankStatus==='difficult'?'selected':''}>Saya rasa sulit</option><option value="unseen" ${state.bankStatus==='unseen'?'selected':''}>Belum pernah dicoba</option></select></div>
<div class="controls" style="justify-content:space-between;margin-bottom:13px"><span class="tiny muted">Menampilkan ${Math.min(f.length,start+1)}–${Math.min(f.length,start+20)} dari <b>${f.length}</b> soal</span><button class="btn sm ghost" data-action="practiceFilter" ${!f.length?'disabled':''}>Latih hasil pencarian →</button></div>
<div class="item-list">${page.length?page.map(q=>`<article class="item"><div class="item-top"><span class="qid">${esc(q.id)} · ${q.origin==='pemateri'?'PEMATERI':'E-LEARNING 2025'}</span>${qBadge(q)}</div><p>${esc(snip(q.text,255))}</p><div class="item-bottom"><div class="chips"><span class="chip">${esc(moduleName(q.module))}</span><span class="chip">${esc(snip(q.chapter,55))}</span></div><div class="controls"><button class="btn sm subtle" data-action="mark" data-id="${q.id}">${saved.bookmarks.includes(q.id)?'★':'☆'}</button><button class="btn sm" data-action="questionDetail" data-id="${q.id}">Buka soal & pembahasan →</button></div></div></article>`).join(''):`<div class="card no-results">Tidak ada soal untuk filter ini. Coba kata kunci atau kategori lain.</div>`}</div><div class="controls" style="justify-content:center;margin-top:20px"><button class="btn subtle sm" data-action="bankPage" data-page="${state.bankPage-1}" ${start===0?'disabled':''}>← Sebelumnya</button>${badge(`Halaman ${state.bankPage+1} / ${Math.max(1,Math.ceil(f.length/20))}`)}<button class="btn subtle sm" data-action="bankPage" data-page="${state.bankPage+1}" ${start+20>=f.length?'disabled':''}>Berikutnya →</button></div>`}
function filteredBank(){let q=state.bankQuery.toLocaleLowerCase('id').trim();return QS.filter(x=>{if(state.bankMod!=='all'&&x.module!==state.bankMod)return false;if(state.bankStatus==='safe'&&!x.scorable)return false;if(state.bankStatus==='risk'&&!x.qa)return false;if(state.bankStatus==='marked'&&!saved.bookmarks.includes(x.id))return false;if(state.bankStatus==='difficult'&&!saved.difficult.includes(x.id))return false;if(state.bankStatus==='unseen'&&saved.attempts[x.id])return false;return !q||[x.id,x.text,x.chapter,x.module,...x.options,x.reason].join(' ').toLocaleLowerCase('id').includes(q)})}
function kamus(){let q=state.glossQuery.toLocaleLowerCase('id');let filtered=DATA.glossary.filter(g=>(state.glossMod==='all'||g.moduleCode===state.glossMod)&&[g.id,g.title,g.description,g.chapter].join(' ').toLocaleLowerCase('id').includes(q));return `${shell('Kamus Pembahasan','91 poin materi dari enam modul, dengan penjelasan awal dan tautan ke kamus PDF lengkap.')}
<div class="searchbar" style="grid-template-columns:1fr 240px"><input class="search" placeholder="Cari kata kunci atau kode K001…" data-search="glossQuery" value="${esc(state.glossQuery)}"/><select class="search" data-select="glossMod"><option value="all">Semua modul</option>${[...new Map(DATA.glossary.map(x=>[x.moduleCode,x.module])).entries()].map(([code,m])=>`<option value="${esc(code)}" ${state.glossMod===code?'selected':''}>${esc(m)}</option>`).join('')}</select></div><p class="tiny muted">${filtered.length} entri ditemukan. Nomor halaman merujuk pada <a href="materi/kamus-pembahasan.pdf" target="_blank">Kamus PDF lengkap</a>.</p><div class="gloss-grid">${filtered.map(g=>`<article class="card gloss"><div class="mini">${esc(g.id)} · ${esc(g.chapter)}</div><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p><div class="controls"><a class="btn sm subtle" target="_blank" rel="noopener" href="materi/kamus-pembahasan.pdf#page=${esc(g.page)}">Baca halaman ${esc(g.page)} ↗</a><button class="btn sm ghost" data-action="glossPractice" data-code="${esc(g.moduleCode)}">Latihan terkait</button></div></article>`).join('')}</div>`}
function stats(){let sc=scores(),history=saved.history||[];let missed=Object.entries(saved.attempts).filter(([k,v])=>v.wrong>0).map(x=>x[0]);return `${shell('Statistik Belajar','Lacak latihan Anda secara lokal. Data ini tersimpan hanya di browser perangkat yang sedang digunakan.')}<div class="stats">${statCard(fmt(sc.attempted),'Soal unik pernah dicoba')}${statCard(sc.accuracy+'%','Akurasi pertanyaan terukur')}${statCard(fmt(missed.length),'Pernah dijawab salah')}${statCard(fmt(history.length),'Sesi diselesaikan')}</div>
<div class="grid-2"><section class="card"><h2>Penguasaan per kompetensi</h2>${MODS.map(m=>{let v=moduleStats(m.code);return `<div class="barrow"><span>${esc(snip(m.name,27))}</span><div class="progress"><i style="width:${v.total?v.seen/v.total*100:0}%"></i></div><span>${v.seen}/${v.total}</span></div>`}).join('')}</section><section class="card"><h2>Latihan tindak lanjut</h2><p class="tiny muted">Anda dapat mengulang soal yang pernah salah, soal yang ditandai, atau soal yang Anda anggap sulit.</p><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" data-action="reviewWrong" ${!missed.length?'disabled':''}>Ulangi ${missed.length} soal yang pernah salah</button><button class="btn subtle" data-action="practiceBookmarks" ${!saved.bookmarks.length?'disabled':''}>Latihan ${saved.bookmarks.length} soal ditandai</button><button class="btn subtle" data-action="practiceDifficult" ${!saved.difficult.length?'disabled':''}>Ulangi ${saved.difficult.length} soal sulit</button></div><div class="divider"></div><div class="actions"><button class="btn sm ghost" data-action="export">Ekspor progres JSON</button><button class="btn sm ghost" data-action="import">Impor progres</button><button class="btn sm danger" data-action="reset">Reset progres</button></div></section></div><section class="card" style="margin-top:16px"><h2>Riwayat sesi terakhir</h2>${history.length?`<div style="overflow-x:auto"><table class="table"><thead><tr><th>Tanggal</th><th>Mode</th><th>Soal</th><th>Dinilai</th><th>Benar</th><th>Akurasi</th></tr></thead><tbody>${history.slice(-15).reverse().map(h=>`<tr><td>${new Date(h.finishedAt).toLocaleString('id-ID')}</td><td>${h.mode==='exam'?'Try out':'Belajar'}</td><td>${h.total}</td><td>${h.scored}</td><td>${h.correct}</td><td>${h.scored?Math.round(h.correct/h.scored*100)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="no-results">Belum ada sesi selesai. Mulai latihan pertama Anda.</div>'}</section>`}
function resources(){return `${shell('Modul & Referensi','Buka sumber asli dari paket ZIP yang diunduh; semuanya tersedia offline jika folder materi tetap bersama index.html.')}<div class="module-grid">${MODS.map((m,i)=>`<div class="card"><div class="module-ic" style="background:${COLORS[i]}1b;color:${COLORS[i]}">${i+1}</div><h3 style="margin-top:12px">${esc(m.name)}</h3><p class="tiny muted">Modul LKPP versi 3.1 (2023). Untuk ketentuan yang berubah, lihat catatan QA.</p><a class="btn sm subtle" target="_blank" rel="noopener" href="${esc(m.url)}">Buka PDF Modul ↗</a></div>`).join('')}</div><div class="sections-head"><h2>Buku pendamping</h2></div><div class="grid-2">${DATA.resources.map(x=>`<div class="card"><h3>${esc(x.label)}</h3><a target="_blank" rel="noopener" href="${esc(x.url)}" class="btn sm subtle">Buka PDF ↗</a></div>`).join('')}</div>`}
function help(){return `${shell('Panduan & Kualitas Data','Ketahui asal kunci jawaban, batas verifikasi, dan cara terbaik menggunakan website untuk belajar.')}
<div class="grid-2"><div class="card"><h2>🧭 Cara menggunakan aplikasi</h2><p><b>Belajar:</b> pilih kompetensi lalu jawab pertanyaan. Tekan <em>Periksa Jawaban</em> untuk melihat penjelasan dan sumber.</p><p><b>Try out:</b> atur jumlah soal dan timer. Penilaian baru muncul setelah sesi diakhiri.</p><p><b>Kamus:</b> cari konsep dari 91 poin pembelajaran lalu buka PDF penjelasan yang lebih lengkap.</p><p><b>Kartu soal:</b> tandai sebagai sulit atau simpan catatan sendiri; semuanya tersimpan di browser perangkat ini.</p><p><b>Cadangan progres:</b> gunakan Ekspor/Impor di Statistik untuk memindahkan data antarbrowser.</p></div><div class="card"><h2>⚠️ Aturan penilaian yang transparan</h2><p><b>157 soal pemateri:</b> mempunyai satu kunci yang terbaca dan tidak ditandai sebagai isu khusus. Ini <em>belum</em> bermakna seluruh regulasinya sudah divalidasi.</p><p><b>73 soal e-learning:</b> pilihan historis peserta memperoleh skor benar (2025).</p><p><b>37 soal pemateri:</b> tujuh indikasi benturan, 25 perlu konfirmasi, lima penanda kunci tidak pasti. Dapat ditelaah, tetapi tidak dinilai otomatis.</p><p><b>27 soal e-learning:</b> pilihan historis memperoleh skor salah, tetapi kunci resmi tidak tercantum. Tidak dinilai otomatis.</p><div class="warning">Pembaruan: seluruh 100 soal try out 2025 sudah memakai redaksi lengkap dari PDF baru (28 halaman); skor historis 73 benar dan 27 salah tetap sama. Untuk 27 soal yang salah, kunci resmi tetap belum tersedia. Regulasi 2025–2026 dapat berbeda dari modul 2023.</div></div></div><div class="card" style="margin-top:17px"><h2>⌨️ Pintasan keyboard saat latihan</h2><p><span class="kbd">1</span>–<span class="kbd">4</span> memilih opsi, <span class="kbd">Enter</span> memeriksa jawaban atau maju, <span class="kbd">←</span>/<span class="kbd">→</span> berpindah soal.</p><div class="divider"></div><h3>Privasi dan ketersediaan</h3><p class="muted tiny">Website ini sepenuhnya offline, tanpa pendaftaran, iklan, atau pengiriman jawaban ke server. Progres hanya tersimpan di penyimpanan lokal browser. Jika browser menghapus datanya, progres bisa hilang; simpan berkas ekspor cadangan secara berkala. Tidak ada fitur sinkronisasi multi-perangkat.</p></div>`}
function resultView(){let h=state.lastResult;if(!h)return shell('Hasil latihan','Riwayat tersedia pada menu Statistik.');let pct=h.scored?Math.round(h.correct/h.scored*100):0;return `<div class="card result-hero"><div class="eyebrow">Sesi selesai</div><h1>${h.mode==='exam'?'Hasil Try Out':'Hasil Latihan'}</h1><div class="result-number">${h.scored?pct+'%':'—'}</div><p class="muted">Akurasi dihitung hanya dari soal dengan kunci yang tersedia dan tidak mempunyai penanda masalah QA.</p><div class="result-badges"><div class="box"><b>${h.total}</b><small>Jumlah soal</small></div><div class="box"><b>${h.correct}</b><small>Benar terukur</small></div><div class="box"><b>${h.scored-h.correct}</b><small>Salah terukur</small></div><div class="box"><b>${h.answered-h.scored}</b><small>Jawaban tanpa penilaian</small></div><div class="box"><b>${h.total-h.answered}</b><small>Dilewati</small></div></div><div class="actions" style="justify-content:center"><button class="btn" data-action="go" data-view="setup">Mulai latihan lagi</button><button class="btn subtle" data-action="go" data-view="stats">Lihat statistik</button></div></div><div class="sections-head"><h2>Tinjau jawaban sesi</h2></div><div class="result-list">${h.items.map(it=>{let q=row(it.id);if(!q)return '';let answer=it.selected||'—';let verdict=!it.selected?'Dilewati':!q.scorable?'Tidak dinilai':it.selected===q.key?'Benar':'Salah';return `<div class="result-row"><div class="info"><b class="qid">${esc(it.id)}</b> <span class="tiny muted">${esc(snip(q.text,85))}</span><div class="tiny muted">Pilihan Anda: ${esc(answer)} · ${verdict}</div></div><button class="btn sm ghost" data-action="questionDetail" data-id="${esc(it.id)}">Pembahasan →</button></div>`}).join('')}</div>`}
function modal(q){if(!q)return '';let chosen=saved.session?.answers?.[q.id]||'',c=classify(q);return `<div class="modalwrap" data-action="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Pembahasan soal ${esc(q.id)}"><button class="icon-btn modal-close" data-action="closeModal" aria-label="Tutup">✕</button><div class="qid">${esc(q.id)} · ${esc(moduleName(q.module))}</div><h2 style="margin-top:11px">${esc(q.text)}</h2><p class="tiny muted">${esc(q.chapter)}</p>${q.options.map((o,i)=>`<p style="padding:7px 11px;margin:4px 0;background:var(--surface2);border-radius:8px;font-size:13px"><b>${'ABCD'[i]}.</b> ${esc(o||'[opsi tidak tersedia]')}</p>`).join('')}<div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">${qBadge(q)}${badge(q.origin==='historis'?'Sumber: E-learning 2025':'Sumber: Pemateri')}</div><div class="divider"></div><h3>Jawaban dan pembahasan</h3>${q.key?`<p class="choice-summary"><b>${q.origin==='historis'?'Pilihan yang benar pada try out 2025':'Kunci pemateri'}: ${esc(q.key)}</b> — ${esc(q.options['ABCD'.indexOf(q.key)]||'')}</p>`:'<p class="warning">Kunci jawaban resmi yang dapat dipastikan tidak tersedia pada sumber ini.</p>'}${q.reason?`<p>${esc(q.reason)}</p>`:'<p class="muted">Belum ada pembahasan substantif yang dapat ditautkan dengan pasti. Gunakan rujukan modul untuk belajar mandiri.</p>'}${q.alternatives?`<p><b>Pembanding opsi:</b> ${esc(q.alternatives)}</p>`:''}${q.qa?`<p class="warning">${esc(q.qaDetail)}</p>`:''}${q.legal?`<p class="tiny"><b>Rujukan peraturan pada audit sebelumnya:</b> ${esc(q.legal)}</p>`:''}${q.reference?`<p class="tiny"><b>Rujukan materi:</b> ${esc(q.reference)}</p>`:''}<p class="tiny muted">Berkas sumber: ${esc(q.sourceFile)}${q.sourcePage?' · halaman '+esc(q.sourcePage):''}. ${q.origin==='historis'?'Naskah lengkap telah diperbarui berdasarkan PDF terbaru; kunci historis belum tentu sesuai regulasi 2026.':''}</p><div class="field"><label for="note">Catatan pribadi untuk soal ini</label><t

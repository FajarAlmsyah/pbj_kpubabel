server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html PBJ_Akademi_V4_Mobile_Responsive.html;

    # Gzip compression untuk performa maksimal di jaringan lokal/publik
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache untuk berkas statis & dokumen PDF materi
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|pdf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Keamanan: cegah akses ke berkas tersembunyi (.git, .env, dll)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

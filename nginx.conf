server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html PBJ_Akademi_V4_Mobile_Responsive.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDF & static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|pdf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
